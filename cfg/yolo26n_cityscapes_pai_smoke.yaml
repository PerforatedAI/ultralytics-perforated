# YOLO26n Cityscapes fine-tune, PerforatedAI forced-cycle smoke.
#
# Purpose is to exercise the port, not to produce a number. Everything that
# the restructure path can get wrong -- optimizer rebuild, param-group
# replacement, initial_lr re-seed, scheduler restart, EMA rebuild, the
# final_eval guard -- should fire in both directions inside half an hour.
#
# Launch:
#   python train_pai.py cfg/yolo26n_cityscapes_pai_smoke.yaml \
#       --perforate-model --fixed-switch-every 6 \
#       --initial-correlation-batches 20
#
# --fixed-switch-every replaces the earlier --n-epochs-to-switch 5. The
# 2026-08-31 run (yolo26n_cityscapes_smoke-2) reached num_cycles 1 at epoch
# 43 and then stayed in dendrite mode for its remaining 17 epochs, because
# adaptive switching only leaves a dendrite cycle once no node improves its
# correlation for p_epochs_to_switch validations and 4 of 36 nodes kept
# improving every epoch. The dendrite-to-neuron half of the cycle therefore
# never ran. Switching on a count is the only way to reach it in a short run.

model: yolo26n.pt
data: cfg/cityscapes-det.yaml

# ========================Horizon and batch===================================
# 40 epochs at --fixed-switch-every 6 gives six switches, so three full
# neuron-to-dendrite-to-neuron cycles.
#
# batch 48 matches the production config, and is what makes this smoke a
# real rehearsal rather than a different run. It gives 62 iterations per
# epoch against 2975 train images, so initial_correlation_batches of 20
# still fits inside one epoch.
#
# batch 48 is also the smallest batch that leaves gradient accumulation at
# one. accumulate is round(nbs / batch), so the earlier batch 16 ran four
# backwards per optimizer.step and PAI logged 7065 warnings about dendrite
# outs and neuron errors stacking. batch 48 rounds 64/48 to 1 and removes
# them entirely.
#
# The plateau LR schedule is not exercised here. A drop needs 7 validations
# without improvement and --fixed-switch-every ends a cycle in 2 or 6, so
# the gate tests the restructure path and the checkpoint path only.
epochs: 40
batch: 48
imgsz: 640 # matches the mmyolo v8 recipe's img_scale (640, 640)
workers: 8

# ========================Optimizer===========================================
# Named explicitly rather than left at 'auto'. The 'auto' threshold is 10000
# evaluated iterations, and this run sits at 1880 while the production run
# sits at 14100, so 'auto' would silently pick a different optimizer for the
# two of them.
#
# warmup_bias_lr MUST be 0.0. The 'auto' path zeroes it for Adam-family
# optimizers, and naming AdamW explicitly skips that, leaving the default 0.1
# against an lr0 of 0.001. That is a 100x bias learning rate for the first 3
# warmup epochs.
#
# weight_decay is 0, not ultralytics' 0.0005. PAI logs "For PAI training it
# is recommended to not use weight decay in your optimizer" at startup, and
# pai_pretraining_decisions.md 1.10 already settled this for the v8 COCO run
# as a deliberate departure from the reference's 0.001.
optimizer: AdamW
lr0: 0.001
lrf: 0.01
warmup_bias_lr: 0.0
weight_decay: 0.0

# ========================Stopping============================================
# patience 0 becomes float('inf') in EarlyStopping.__init__, so the stopper
# never fires. PAI owns stopping and signals it through trainer.stop.
#
# train_pai.py sets this for any --perforate-model run, so the line is
# redundant for the smoke as launched. It stays because the smoke is short
# enough to be run plain when the port itself is what is being checked.
#
# This is not optional. EarlyStopping votes at trainer.py:616, nineteen lines
# before on_fit_epoch_end where PAI is consulted, and self.stop is an
# OR-accumulate, so PAI could never veto it. Worse, both watch the same
# signal and read it oppositely: a plateau is EarlyStopping's evidence that
# training is done, and PAI's trigger to add a dendrite.
patience: 0

# ========================Validation cadence==================================
# Mandatory. PAI counts its switch epochs in validations, not train epochs,
# so anything other than validating every epoch changes what they mean.
val: True

# ========================Disabled on purpose=================================
# amp: measured to break dendrite training on the v8 arms
# (pai_pretraining_decisions.md 1.4b, "off, not usable"). A fix was attempted
# there and did not hold.
#
# close_mosaic: fires at epoch (epochs - close_mosaic), an absolute epoch
# number. Neither arm knows where training ends -- PAI stops when it signals
# training_complete -- so a trigger derived from a safety ceiling would fire
# in one arm and not the other. Same reasoning that dropped
# mmdet.PipelineSwitchHook from the v8 configs. Costs both arms about one
# point of absolute mAP, equally.
#
# compile: torch.compile over PAI-wrapped modules is untested.
amp: False
close_mosaic: 0
compile: False

# ========================Reproducibility=====================================
# deterministic is False on purpose, mirroring the v8 configs. Setting it True
# makes torch.use_deterministic_algorithms(True) raise on any op without a
# deterministic CUDA kernel, and several ops in this detection stack qualify.
seed: 6502
deterministic: False

# ========================Output==============================================
# project doubles as the W&B project name. wb.py takes args.project with '/'
# replaced by '-', so anything with a slash in it lands in W&B under a
# mangled name. Keep it slash free so the local run dir and the W&B project
# are the same string.
#
# The W&B integration is off by default (SETTINGS['wandb'] is False). Enable
# it once per box with:
#   yolo settings wandb=True
project: yolo26-cityscapes
name: yolo26n_cityscapes_cycles
exist_ok: False
plots: True
